# Local development database. Every teammate gets the same Postgres with one command:
#
#   docker compose up -d
#
# The backend's default datasource (application.yaml) points here. Tests do NOT use this
# container - they start their own throwaway Postgres via Testcontainers, so running the
# test suite can never corrupt your dev data.

services:
  postgres:
    image: postgres:17-alpine
    container_name: leadlens-postgres
    environment:
      POSTGRES_DB: leadlens
      POSTGRES_USER: leadlens
      POSTGRES_PASSWORD: leadlens
    ports:
      - "5432:5432"
    volumes:
      - leadlens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlens -d leadlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leadlens-pgdata:
