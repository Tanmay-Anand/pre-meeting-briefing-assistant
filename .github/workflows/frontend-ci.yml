# Builds the MV3 extension at leadlens/ - the only project in this repo since the backend was
# removed in favor of the extension calling leads-crm-backend's ai-query-sdk directly.

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'leadlens/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'leadlens/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: leadlens

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node 20.19+ / 22.12+; 22 keeps headroom.
          node-version: 22
          cache: npm
          cache-dependency-path: leadlens/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: leadlens-extension
          path: leadlens/build/
          retention-days: 7
          if-no-files-found: error
