# Local development profile. Run with: -Dspring-boot.run.profiles=local
#
# Secrets NEVER live in this file. They come from environment variables, or from the
# per-adapter .env.<crmKey> files imported below (IMPLEMENTATION_PLAN.md G.7).
# .gitignore already excludes .env*.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Per-CRM config/secrets, one file per adapter (G.7). All optional: a missing file is
  # not an error, so a teammate who has not configured Leadrat can still boot the app.
  config:
    import:
      - optional:file:.env.demo[.properties]
      - optional:file:.env.leadrat[.properties]
      - optional:file:.env.generic-dom[.properties]

logging:
  level:
    com.leadlens: DEBUG
    org.hibernate.SQL: DEBUG
